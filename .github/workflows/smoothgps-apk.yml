name: Build SmoothGps APK
on:
  workflow_dispatch:
  push:
    paths: ["SmoothGps/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmoothGps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmoothGps-debug-apk
          path: SmoothGps/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to fixed "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SmoothGps.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest SmoothGps.apk --target "$GITHUB_SHA" \
            --title "Smooth GPS (latest)" \
            --notes "Latest build, commit $GITHUB_SHA"
